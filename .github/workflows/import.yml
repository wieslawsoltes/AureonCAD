name: Import and verify Aureon CAD source

on:
  push:
    branches: [main]
    paths: ['.delivery/**', '.github/workflows/import.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aureon-source-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify and expand original source
        shell: python
        run: |
          import hashlib, io, pathlib, tarfile
          parts = sorted(pathlib.Path('.delivery').glob('source.*'))
          assert len(parts) == 10, 'Incomplete source transfer'
          data = b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(data).hexdigest() == '1d2ba782e23ff915fdb01e6029b59c32cb97aaf2ffe77fdd8e54db38a0420cd2', 'Source checksum mismatch'
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:xz') as archive:
              archive.extractall('.', filter='data')
          with open('.gitignore', 'a') as f:
              f.write('\n_site/\n')
          pathlib.Path('.nojekyll').touch()
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test geometry and build standalone app
        run: |
          set -o pipefail
          npm test | tee docs/unit-test-results.txt
          npm run build
          node scripts/build-examples.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify browser workflows and regenerate screenshots
        run: |
          set -o pipefail
          xvfb-run -a python tests/browser_smoke.py --standalone --headed --software | tee docs/browser-test-log.txt
      - name: Commit expanded source and verified build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .delivery
          git add .gitignore .nojekyll LICENSE README.md index.html styles.css package.json src scripts tests docs examples dist
          git commit -m 'Import complete Aureon CAD engine, workbench, tests, examples and standalone build'
          git push origin HEAD:main
