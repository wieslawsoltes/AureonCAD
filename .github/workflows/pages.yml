name: Test and deploy Aureon CAD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aureon-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test geometry and build distributions
        run: |
          set -o pipefail
          npm test | tee docs/unit-test-results.txt
          npm run build
          node scripts/build-examples.mjs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test standalone editing workflows
        run: |
          set -o pipefail
          xvfb-run -a python tests/browser_smoke.py --standalone --headed --software | tee docs/browser-test-log.txt
      - name: Prepare Pages artifact
        run: node scripts/build-site.mjs
      - name: Test modular application at a subdirectory URL
        run: |
          python -m http.server 8080 --bind 127.0.0.1 > /tmp/aureon-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:8080/_site/version.json && break
            sleep 1
          done
          python tests/published_smoke.py --url http://127.0.0.1:8080/_site/ --commit "$GITHUB_SHA" --output docs/modular-smoke.json
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          retention-days: 14
          path: |
            docs/*test*.txt
            docs/*test*.json
            docs/*smoke.json
            docs/*.png
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser verification dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify deployed commit and real rendering over HTTPS
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          for attempt in $(seq 1 6); do
            if python tests/published_smoke.py --url "$PAGE_URL" --commit "$GITHUB_SHA"; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep 5
          done
      - name: Upload live-site evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-site-evidence
          path: docs/published-smoke.json
          retention-days: 14
